# Images publiées sur GitHub Container Registry (voir .github/workflows/docker-publish.yml).
#   docker compose pull && docker compose up -d   -> images du registre
#   docker compose up -d --build                  -> images construites en local
services:
  frontend:
    image: ${CERBER_REGISTRY:-ghcr.io/semestersmighter}/cerber-frontend:${CERBER_TAG:-latest}
    build: ./frontend
    container_name: cerber-frontend
    ports:
      - "${HTTP_PORT:-8080}:80"     # redirige vers HTTPS
      - "${HTTPS_PORT:-8443}:443"
    environment:
      HOST_HEADER: ${HOST_HEADER:-host}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    volumes:
      # Certificat TLS conservé entre les recréations du conteneur (auto-signé s'il est absent)
      - certs:/etc/nginx/certs
    depends_on:
      - backend
      - svc-impots
      - svc-intranet
      - svc-ficoba
    restart: unless-stopped

  backend:
    image: ${CERBER_REGISTRY:-ghcr.io/semestersmighter}/cerber-backend:${CERBER_TAG:-latest}
    build: ./backend
    container_name: cerber-backend
    env_file: .env
    # Pas de port publié : l'API n'est joignable qu'à travers nginx (/api)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---- Services protégés par CERBER (même image, un conteneur par service) ----
  # Aucun port publié : ils ne sont joignables qu'à travers nginx.
  svc-impots:
    image: ${CERBER_REGISTRY:-ghcr.io/semestersmighter}/cerber-services:${CERBER_TAG:-latest}
    build: ./services
    container_name: cerber-svc-impots
    environment:
      SERVICE_SLUG: impots
      CERBER_API: http://backend:8000
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    restart: unless-stopped

  svc-intranet:
    image: ${CERBER_REGISTRY:-ghcr.io/semestersmighter}/cerber-services:${CERBER_TAG:-latest}
    build: ./services
    container_name: cerber-svc-intranet
    environment:
      SERVICE_SLUG: intranet
      CERBER_API: http://backend:8000
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    restart: unless-stopped

  svc-ficoba:
    image: ${CERBER_REGISTRY:-ghcr.io/semestersmighter}/cerber-services:${CERBER_TAG:-latest}
    build: ./services
    container_name: cerber-svc-ficoba
    environment:
      SERVICE_SLUG: ficoba
      CERBER_API: http://backend:8000
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: cerber-db
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
      # Exécuté automatiquement au premier démarrage (base vide)
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
  certs:
