apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cerber
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: backend
          image: ghcr.io/semestersmighter/cerber-backend:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef: { name: cerber-env }
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket: { port: 8000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cerber
spec:
  selector: { app: backend }
  ports:
    - port: 8000
