apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: cerber
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: cerber
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          envFrom:
            - secretRef: { name: cerber-env }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: db-data }
        - name: init
          configMap: { name: db-init }
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: cerber
spec:
  selector: { app: db }
  ports:
    - port: 5432
