apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cerber
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: nginx
          image: ghcr.io/semestersmighter/cerber-frontend:latest
          imagePullPolicy: Always
          env:
            - name: HOST_HEADER
              valueFrom:
                secretKeyRef: { name: cerber-env, key: HOST_HEADER }
            - name: ALLOWED_HOSTS
              valueFrom:
                secretKeyRef: { name: cerber-env, key: ALLOWED_HOSTS }
            - name: HTTPS_PORT
              valueFrom:
                secretKeyRef: { name: cerber-env, key: HTTPS_PORT }
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: certs
              mountPath: /etc/nginx/certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: cerber-tls
            items:
              - { key: tls.crt, path: cerber.crt }
              - { key: tls.key, path: cerber.key }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cerber
spec:
  type: NodePort
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
    - name: https
      port: 443
      targetPort: 443
      nodePort: 30443
