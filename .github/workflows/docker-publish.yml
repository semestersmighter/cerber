# Construit les images CERBER et les publie sur GitHub Container Registry (ghcr.io).
#   push sur main  -> tags latest et sha-<commit>
#   tag v1.2.0     -> tags 1.2.0, 1.2 et sha-<commit>
#   pull request   -> construction seule (vérifie que les images se construisent), rien n'est publié
name: Images Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # publication sur ghcr.io avec le GITHUB_TOKEN

jobs:
  build:
    name: cerber-${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [frontend, backend, services]

    steps:
      - uses: actions/checkout@v4

      # Images multi-architectures : PC (amd64) et Mac Apple Silicon / Raspberry Pi (arm64)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Noms et tags des images ; ajoute aussi le label org.opencontainers.image.source
      # qui rattache le paquet au dépôt sur GitHub
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cerber-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=pr

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
